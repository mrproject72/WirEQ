app-id: io.github.bhack.wireq
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: wireq
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-config/wireq
  - --filesystem=xdg-cache/wireq
  - --talk-name=org.freedesktop.Flatpak
  - --socket=pipewire
  - --socket=pulseaudio

modules:
  - name: wireq
    buildsystem: cargo
    sources:
      - type: dir
        path: .
